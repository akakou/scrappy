version: "3.3"
services:
  app:
    user: "attestation"
    build: "./container"
    working_dir: "/attestation/"
    volumes:
      - ./:/attestation/:z
      - /sys/class/tpm/tpm0/:/sys/class/tpm/tpm0/
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/tpm0:/dev/tpm0
      - /dev/tpmrm0:/dev/tpmrm0
      - /attestation/thirdparty/ecdaa
    environment:                                                            
      - EDITOR=vim  
      - DISPLAY=${DISPLAY}
      - ECDAA_CURVES=FP256BN
      - TPM2TOOLS_TCTI="device:/dev/tpm0"
      - LD_LIBRARY_PATH=/usr/local/lib/

    command: sh -c "/attestation/container/run.sh"
    privileged: true
    ports:
      - 5000:5000